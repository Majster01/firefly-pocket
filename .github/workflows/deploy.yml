# Build Pocket Next and deploy it to FireflyX. main is production: every push
# to it (a merged PR) is deployed. See DEPLOYING.md.
#
#   1. image   ghcr.io/majster01/firefly-pocket-next:sha-<commit>
#   2. deploy  FireflyX's "Pin fork image" workflow sets that tag in its compose
#              file and commits to its master; the server deploys master.
#
# Needs the secret FIREFLYX_DISPATCH_TOKEN: a fine-grained token for
# Majster01/FireflyX only, with "Actions: Read and write".
name: Deploy

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:   # rebuild and redeploy main, e.g. after a failed run

# A newer push to main supersedes a build still running.
concurrency:
  group: deploy
  cancel-in-progress: true

permissions: {}

jobs:
  image:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v5

      - id: tag
        run: |
          echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          # The FireflyX server is a cx23 (x86). Add linux/arm64 for an ARM one.
          platforms: linux/amd64
          build-args: APP_VERSION=next.${{ steps.tag.outputs.short }}
          tags: ghcr.io/majster01/firefly-pocket-next:${{ steps.tag.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Pin the image in FireflyX, which deploys it
        env:
          GH_TOKEN: ${{ secrets.FIREFLYX_DISPATCH_TOKEN }}
          TAG: ${{ needs.image.outputs.tag }}
        run: gh workflow run pin.yml --repo Majster01/FireflyX --ref master -f component=next -f tag="$TAG"

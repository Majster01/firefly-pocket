version: '3.3'
services:
  firefly-pico:
    image: cioraneanu/firefly-pico:latest
    ports:
      - "6976:80"
    environment:
      - FIREFLY_URL=https://firefly.domain.com
      # Optional: on hosts that don't let non-root processes bind port 80 (e.g. Synology
      # Container Manager), change the mapping above to "6976:8080" and uncomment this:
      # - NGINX_PORT=8080
      # Optional: AI assistant "Ramble" (any OpenAI compatible API)
      # - ASSISTANT_LLM_ENDPOINT=https://api.openai.com/v1/chat/completions
      # - ASSISTANT_LLM_MODEL=gpt-4o-mini
      # - ASSISTANT_LLM_API_KEY=your-api-key
      # - ASSISTANT_LLM_CONTEXT=
      # Optional: voice transcription for audio rambles
      # - ASSISTANT_TRANSCRIPTION_ENDPOINT=https://api.openai.com/v1/audio/transcriptions
      # - ASSISTANT_TRANSCRIPTION_MODEL=gpt-4o-mini-transcribe
      # - ASSISTANT_TRANSCRIPTION_API_KEY=your-api-key
      # - ASSISTANT_TRANSCRIPTION_LANGUAGE=en
      # Optional: Web Push + app badge, see docs/web-push.md
      # - VAPID_PUBLIC_KEY=
      # - VAPID_PRIVATE_KEY=
      # - VAPID_SUBJECT=mailto:you@example.com
      # - NOTIFY_API_TOKEN=at-least-32-characters-shared-with-the-importer
    volumes:
      - ./firefly-pico-data:/var/www/html/database/data
      # Optional: custom icons (.svg/.png/.webp/.jpg) for the icon picker
      # - ./firefly-pico-icons:/var/www/html/storage/app/custom-icons:ro
    restart: unless-stopped

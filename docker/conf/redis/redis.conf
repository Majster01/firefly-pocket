# The bundled redis: the Laravel Horizon job queue and the cache of Firefly
# answers (CACHE_DRIVER=redis, README "Caching"). Reachable from this container only.
bind 127.0.0.1
port 6379
protected-mode yes
daemonize no
dir /tmp/redis
pidfile /tmp/redis/redis.pid
logfile ""
# Both are transient: skip persistence. A restart starts with an empty cache,
# which Pocket refills from Firefly.
save ""
appendonly no
# A ceiling for the cache. Only keys with an expiry are evicted: the cached
# answers. The queue and the cache's data version carry none, so they stay.
maxmemory 256mb
maxmemory-policy volatile-lru
